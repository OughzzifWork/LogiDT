version: '3.8'

services:
  logitrack-app:
    image: node:22-alpine
    container_name: logitrack-pwa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - logitrack_data:/app/data
      # Prevent node_modules overwriting from host
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run build && npm start"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  logitrack_data:
    driver: local
