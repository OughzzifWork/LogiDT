<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="110" fill="#0f172a" />
  <rect x="24" y="24" width="464" height="464" rx="90" fill="url(#grad)" opacity="0.12" />
  
  <!-- Truck / Logistics Icon Core inside safe zone -->
  <g filter="url(#shadow)" transform="translate(64, 80)">
    <!-- Truck Cabin & Body -->
    <rect x="30" y="80" width="220" height="170" rx="16" fill="#3b82f6" />
    <!-- Barcode lines on truck cargo -->
    <rect x="65" y="115" width="12" height="80" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="87" y="115" width="6" height="80" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="103" y="115" width="18" height="80" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="131" y="115" width="8" height="80" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="149" y="115" width="14" height="80" rx="4" fill="#ffffff" opacity="0.9" />
    <rect x="173" y="115" width="10" height="80" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="193" y="115" width="20" height="80" rx="4" fill="#ffffff" opacity="0.9" />

    <!-- Cabin -->
    <path d="M255 130 L310 130 L345 180 L345 250 L255 250 Z" fill="#2563eb" />
    <!-- Cabin Window -->
    <path d="M265 145 L302 145 L328 185 L265 185 Z" fill="#93c5fd" opacity="0.85" />
    <!-- Headlight -->
    <circle cx="340" cy="225" r="10" fill="#facc15" />

    <!-- Wheels -->
    <circle cx="95" cy="255" r="38" fill="#1e293b" stroke="#64748b" stroke-width="8" />
    <circle cx="95" cy="255" r="16" fill="#cbd5e1" />
    
    <circle cx="205" cy="255" r="38" fill="#1e293b" stroke="#64748b" stroke-width="8" />
    <circle cx="205" cy="255" r="16" fill="#cbd5e1" />

    <circle cx="305" cy="255" r="38" fill="#1e293b" stroke="#64748b" stroke-width="8" />
    <circle cx="305" cy="255" r="16" fill="#cbd5e1" />

    <!-- Verified Badge with Camera / Check -->
    <circle cx="310" cy="80" r="48" fill="#10b981" stroke="#0f172a" stroke-width="6" />
    <!-- Checkmark -->
    <path d="M292 80 L305 93 L332 64" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
